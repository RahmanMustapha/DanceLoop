<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- viewport-fit=cover lets us paint into the iPhone safe areas later; user-scalable=no keeps
     pinch-zoom from fighting the timeline drag gestures -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Loop — movement study</title>
<style>
  /* ---- Design tokens -------------------------------------------------------
     Direction: a "studio monitor" — deep warm charcoal so footage reads cleanly
     in a dim studio, with one signature: the loop section rendered as a lit amber
     band on the timeline, like a stage light on the slice you're studying.
     Dependency-free on purpose: this runs offline, instantly, on a phone in a
     studio with no wifi. Type personality is carried by the mono timecodes (which
     are functionally correct — frame study wants tabular figures) and the layout,
     not by a downloaded display face. */
  :root{
    --bg:#16140F;          /* warm charcoal, not pure black */
    --surface:#211E17;     /* panels / controls */
    --surface-2:#2C281E;   /* raised controls */
    --line:#3A3528;        /* hairlines */
    --text:#EDE7D9;        /* warm off-white */
    --muted:#8A8270;       /* labels, secondary */
    --spot:#E8A33D;        /* the loop band — the "stage light" */
    --spot-hi:#F4C66B;     /* band highlight */
    --playhead:#FFFFFF;    /* current position, kept distinct from the band */
    --in:#5FD3A0;          /* IN handle */
    --out:#E86F6F;         /* OUT handle */
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;flex-direction:column;
    overflow:hidden;
    /* respect the notch/home-bar */
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .mono{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-variant-numeric:tabular-nums;}

  header{
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 18px;border-bottom:1px solid var(--line);
  }
  header h1{
    font-size:15px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--text);
  }
  header h1 span{color:var(--spot);}
  .pick{
    background:var(--surface-2);color:var(--text);border:1px solid var(--line);
    border-radius:9px;padding:9px 14px;font-size:13px;font-weight:500;cursor:pointer;
  }
  .pick:active{background:var(--surface);}
  input[type=file]{display:none;}

  /* ---- Stage: the video ---------------------------------------------------- */
  .stage{
    flex:1;min-height:0;display:flex;align-items:center;justify-content:center;
    background:#000;position:relative;
  }
  video{max-width:100%;max-height:100%;display:block;background:#000;}
  .empty{
    position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:14px;color:var(--muted);
    text-align:center;padding:30px;
  }
  .empty strong{color:var(--text);font-size:17px;font-weight:600;}
  .empty p{font-size:13px;max-width:280px;line-height:1.5;}

  /* ---- Controls ------------------------------------------------------------ */
  .panel{background:var(--surface);border-top:1px solid var(--line);padding:14px 16px 18px;}

  /* Timeline: the signature. A lane with a lit amber loop band + IN/OUT handles
     + a bright playhead sweeping across. */
  .timeline{
    position:relative;height:46px;border-radius:10px;background:var(--surface-2);
    border:1px solid var(--line);overflow:hidden;touch-action:none;cursor:pointer;
  }
  .band{                /* the lit loop region */
    position:absolute;top:0;bottom:0;
    background:linear-gradient(180deg,rgba(244,198,107,.30),rgba(232,163,61,.16));
    border-left:2px solid var(--in);border-right:2px solid var(--out);
  }
  .band::before{        /* soft glow at the top edge — the "light" */
    content:"";position:absolute;top:0;left:0;right:0;height:2px;
    background:linear-gradient(90deg,var(--in),var(--spot-hi),var(--out));
    box-shadow:0 0 10px var(--spot);
  }
  .handle{
    position:absolute;top:0;bottom:0;width:22px;transform:translateX(-50%);
    display:flex;align-items:center;justify-content:center;touch-action:none;cursor:ew-resize;
  }
  .handle::after{content:"";width:3px;height:60%;border-radius:2px;}
  .handle.in::after{background:var(--in);}
  .handle.out::after{background:var(--out);}
  .playhead{
    position:absolute;top:0;bottom:0;width:2px;background:var(--playhead);
    transform:translateX(-1px);box-shadow:0 0 6px rgba(255,255,255,.6);pointer-events:none;
  }

  .times{display:flex;justify-content:space-between;margin-top:8px;font-size:12px;color:var(--muted);}
  .times .now{color:var(--text);}
  .times .in{color:var(--in);}
  .times .out{color:var(--out);}

  .row{display:flex;gap:8px;margin-top:14px;align-items:center;flex-wrap:wrap;}
  button.ctrl{
    background:var(--surface-2);color:var(--text);border:1px solid var(--line);
    border-radius:9px;padding:11px 13px;font-size:13px;font-weight:500;cursor:pointer;
    min-width:44px;min-height:44px;display:flex;align-items:center;justify-content:center;
  }
  button.ctrl:active{background:var(--surface);}
  button.ctrl.primary{background:var(--spot);color:#1b1206;border-color:var(--spot);font-weight:700;}
  button.ctrl.armed{outline:2px solid currentColor;outline-offset:-2px;}
  .ctrl[disabled]{opacity:.4;pointer-events:none;}

  .speed{display:flex;gap:6px;margin-top:12px;align-items:center;flex-wrap:wrap;}
  .speed .label{font-size:12px;color:var(--muted);margin-right:4px;}
  .sp{
    background:var(--surface-2);color:var(--muted);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;font-size:13px;cursor:pointer;min-width:44px;min-height:40px;
  }
  .sp.active{background:var(--spot);color:#1b1206;border-color:var(--spot);font-weight:700;}

  .hint{margin-top:12px;font-size:11.5px;color:var(--muted);line-height:1.5;}
</style>
</head>
<body>

<header>
  <h1>Loop<span>.</span></h1>
  <label class="pick">Open video
    <input id="file" type="file" accept="video/*">
  </label>
</header>

<div class="stage">
  <video id="v" playsinline webkit-playsinline></video>
  <div class="empty" id="empty">
    <strong>No clip loaded</strong>
    <p>Open a video to study. Set an in and out point, loop the slice, and slow it down to watch the movement.</p>
  </div>
</div>

<div class="panel">
  <div class="timeline" id="timeline">
    <div class="band" id="band" style="display:none"></div>
    <div class="handle in" id="hin" style="display:none"></div>
    <div class="handle out" id="hout" style="display:none"></div>
    <div class="playhead" id="playhead" style="display:none"></div>
  </div>

  <div class="times mono">
    <span class="in" id="tIn">in —</span>
    <span class="now" id="tNow">0:00.00</span>
    <span class="out" id="tOut">out —</span>
  </div>

  <div class="row">
    <button class="ctrl primary" id="play" disabled>Play</button>
    <button class="ctrl" id="stepBack" disabled title="Previous frame">⟨ frame</button>
    <button class="ctrl" id="stepFwd" disabled title="Next frame">frame ⟩</button>
    <button class="ctrl" id="setIn" disabled>Set in</button>
    <button class="ctrl" id="setOut" disabled>Set out</button>
    <button class="ctrl" id="loopBtn" disabled>Loop: off</button>
    <button class="ctrl" id="clear" disabled>Clear</button>
  </div>

  <div class="speed">
    <span class="label">Speed</span>
    <button class="sp" data-rate="1">1×</button>
    <button class="sp" data-rate="0.75">¾</button>
    <button class="sp" data-rate="0.5">½</button>
    <button class="sp" data-rate="0.35">.35</button>
    <button class="sp" data-rate="0.25">¼</button>
    <button class="sp" data-rate="0.1">.1</button>
  </div>

  <p class="hint">Tap the timeline to seek. Drag the green/red handles to bound the slice. Frame step assumes 30fps for now.</p>
</div>

<script>
/* =============================================================================
   Core study tool. The interesting mechanics, with the why:

   1. SLOW MOTION is just video.playbackRate. iOS Safari honors fractional rates
      but may clamp very low ones — that's why .1 is the floor here; we'll find the
      real usable bottom empirically on your phone.

   2. SECTION LOOP is driven by a requestAnimationFrame watch loop, NOT the
      'timeupdate' event. timeupdate only fires ~4×/sec, so wrapping precisely at
      the OUT point would visibly overshoot. rAF checks currentTime every frame and
      snaps back to IN the instant we pass OUT — tight, seamless repeat.

   3. FRAME STEP: HTML5 video has no exact frame API without requestVideoFrameCallback,
      so for v1 we approximate with 1/fps seconds per step (fps hardcoded to 30).
      Good enough to validate the feel; we make fps real later.
   ========================================================================== */

const v = document.getElementById('v');
const FPS = 30;                  // TODO: detect / make configurable later

let inPt = null, outPt = null;   // section bounds in seconds (null = unset)
let looping = false;
let rate = 1;

// ---- element refs ----------------------------------------------------------
const el = id => document.getElementById(id);
const timeline = el('timeline'), band = el('band'), hin = el('hin'),
      hout = el('hout'), playhead = el('playhead'), empty = el('empty');
const tIn = el('tIn'), tNow = el('tNow'), tOut = el('tOut');
const playBtn = el('play'), loopBtn = el('loopBtn');
const ctrlButtons = ['play','stepBack','stepFwd','setIn','setOut','loopBtn','clear'].map(el);

// ---- helpers ---------------------------------------------------------------
function fmt(t){                  // 1:23.45
  if (t == null || isNaN(t)) return '—';
  const m = Math.floor(t/60), s = (t % 60);
  return m + ':' + s.toFixed(2).padStart(5,'0');
}
function setEnabled(on){ ctrlButtons.forEach(b => b.disabled = !on); }

// ---- load a file -----------------------------------------------------------
el('file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (!f) return;
  v.src = URL.createObjectURL(f);   // local blob URL, nothing leaves the device
  v.load();
});

v.addEventListener('loadedmetadata', () => {
  empty.style.display = 'none';
  inPt = null; outPt = null; looping = false;
  loopBtn.textContent = 'Loop: off'; loopBtn.classList.remove('armed');
  setEnabled(true);
  [band,hin,hout,playhead].forEach(x => x.style.display = '');
  band.style.display = 'none'; hin.style.display='none'; hout.style.display='none';
  v.playbackRate = rate;
  drawTimeline();
});

// ---- play / pause ----------------------------------------------------------
playBtn.addEventListener('click', () => v.paused ? v.play() : v.pause());
v.addEventListener('play',  () => playBtn.textContent = 'Pause');
v.addEventListener('pause', () => playBtn.textContent = 'Play');

// ---- speed -----------------------------------------------------------------
document.querySelectorAll('.sp').forEach(b => {
  b.addEventListener('click', () => {
    rate = parseFloat(b.dataset.rate);
    v.playbackRate = rate;
    document.querySelectorAll('.sp').forEach(x => x.classList.remove('active'));
    b.classList.add('active');
  });
});
document.querySelector('.sp[data-rate="1"]').classList.add('active');

// ---- in / out / loop -------------------------------------------------------
el('setIn').addEventListener('click', () => {
  inPt = v.currentTime;
  if (outPt != null && inPt >= outPt) outPt = null;  // keep them ordered
  drawTimeline();
});
el('setOut').addEventListener('click', () => {
  outPt = v.currentTime;
  if (inPt != null && outPt <= inPt) inPt = null;
  drawTimeline();
});
loopBtn.addEventListener('click', () => {
  looping = !looping;
  loopBtn.textContent = 'Loop: ' + (looping ? 'on' : 'off');
  loopBtn.classList.toggle('armed', looping);
  if (looping && inPt != null && v.currentTime < inPt) v.currentTime = inPt;
});
el('clear').addEventListener('click', () => {
  inPt = outPt = null; looping = false;
  loopBtn.textContent = 'Loop: off'; loopBtn.classList.remove('armed');
  drawTimeline();
});

// ---- frame step ------------------------------------------------------------
el('stepBack').addEventListener('click', () => { v.pause(); v.currentTime = Math.max(0, v.currentTime - 1/FPS); });
el('stepFwd').addEventListener('click',  () => { v.pause(); v.currentTime = Math.min(v.duration, v.currentTime + 1/FPS); });

// ---- the loop watcher + playhead (rAF) -------------------------------------
function frame(){
  if (v.duration){
    // wrap the slice
    const lo = inPt ?? 0, hi = outPt ?? v.duration;
    if (looping && v.currentTime >= hi){ v.currentTime = lo; }
    // update readouts + playhead position
    tNow.textContent = fmt(v.currentTime);
    const w = timeline.clientWidth;
    playhead.style.left = (v.currentTime / v.duration) * w + 'px';
    playhead.style.display = '';
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ---- draw IN/OUT band + handles + labels -----------------------------------
function drawTimeline(){
  const w = timeline.clientWidth, d = v.duration || 1;
  tIn.textContent  = 'in '  + fmt(inPt);
  tOut.textContent = 'out ' + fmt(outPt);
  if (inPt != null && outPt != null){
    const a = (inPt/d)*w, b = (outPt/d)*w;
    band.style.display=''; band.style.left=a+'px'; band.style.width=(b-a)+'px';
    hin.style.display='';  hin.style.left=a+'px';
    hout.style.display=''; hout.style.left=b+'px';
  } else {
    band.style.display='none';
    hin.style.display  = inPt  != null ? '' : 'none';  if(inPt!=null)  hin.style.left  =(inPt/d)*w+'px';
    hout.style.display = outPt != null ? '' : 'none';  if(outPt!=null) hout.style.left =(outPt/d)*w+'px';
  }
}

// ---- timeline interaction (pointer events unify mouse + touch) -------------
function timeFromX(clientX){
  const r = timeline.getBoundingClientRect();
  const frac = Math.min(1, Math.max(0, (clientX - r.left)/r.width));
  return frac * (v.duration || 0);
}
let dragging = null;  // 'in' | 'out' | 'seek'
function startDrag(e, which){ dragging = which; timeline.setPointerCapture?.(e.pointerId); e.preventDefault(); }
hin.addEventListener('pointerdown',  e => startDrag(e,'in'));
hout.addEventListener('pointerdown', e => startDrag(e,'out'));
timeline.addEventListener('pointerdown', e => {
  if (e.target === hin || e.target === hout) return;
  dragging = 'seek'; v.currentTime = timeFromX(e.clientX); timeline.setPointerCapture?.(e.pointerId);
});
timeline.addEventListener('pointermove', e => {
  if (!dragging) return;
  const t = timeFromX(e.clientX);
  if (dragging === 'in'){  inPt  = (outPt!=null) ? Math.min(t, outPt-0.03) : t; }
  else if (dragging === 'out'){ outPt = (inPt!=null) ? Math.max(t, inPt+0.03) : t; }
  else { v.currentTime = t; }
  drawTimeline();
});
window.addEventListener('pointerup', () => dragging = null);

// keep the band sized correctly on rotation / resize
window.addEventListener('resize', drawTimeline);
</script>
</body>
</html>
